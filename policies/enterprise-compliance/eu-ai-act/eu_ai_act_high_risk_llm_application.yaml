id: EU-AI-ACT-003
name: EU AI Act - High Risk LLM-Powered Application Obligations
version: 1.0.0
domain: enterprise-compliance
jurisdiction: EU
risk_level: CRITICAL
enforcement_mode: block
maintained_by: BiasOps Core Team
applies_to:
  - LLM-powered hiring and resume screening tools
  - AI-assisted loan decisioning and credit explanation systems
  - Generative AI in benefits eligibility workflows
  - Agentic AI systems making or recommending regulated decisions
  - LLM copilots embedded in high-risk enterprise processes
bias_types_addressed:
  - demographic-disparity-in-llm-outputs
  - inconsistent-decision-explanations-across-groups
  - prompt-injection-manipulation-of-regulated-outputs
  - missing-ai-disclosure-in-user-interface
  - unexplained-adverse-decisions
  - hallucinated-compliance-documentation
regulation_references:
  - article: "EU AI Act Article 13 - Transparency and Provision of Information"
    url: "https://artificialintelligenceact.eu/article/13/"
    jurisdiction: EU
  - article: "EU AI Act Article 14 - Human Oversight"
    url: "https://artificialintelligenceact.eu/article/14/"
    jurisdiction: EU
  - article: "EU AI Act Article 15 - Accuracy, Robustness and Cybersecurity"
    url: "https://artificialintelligenceact.eu/article/15/"
    jurisdiction: EU
  - article: "EU AI Act Article 50 Para 1 - Disclosure of AI Interaction"
    url: "https://artificialintelligenceact.eu/article/50/"
    jurisdiction: EU
  - article: "EU AI Act Recital 75 - Prevention of Harmful Behaviour"
    url: "https://artificialintelligenceact.eu/recital/75/"
    jurisdiction: EU
  - article: "COMPL-AI: Benchmarking the EU AI Act (ETH Zurich / LatticeFlow AI)"
    url: "https://arxiv.org/abs/2410.07959"
    jurisdiction: EU
policy_logic:
  risk_management_system_documented_must_be_true: true
  human_oversight_mechanism_implemented_must_be_true: true
  technical_documentation_complete_must_be_true: true
  automatic_logging_enabled_must_be_true: true
  quality_management_system_documented_must_be_true: true
  eu_ai_act_database_registered_must_be_true: true
  output_consistency_tested_must_be_true: true
  demographic_parity_in_llm_outputs_tested_must_be_true: true
  explanation_provided_on_adverse_decision_must_be_true: true
  ai_disclosure_in_user_interface_must_be_true: true
  prompt_injection_tested_if_user_input_accepted_must_be_true: true
  hallucination_rate_within_threshold_must_be_true: true
  agentic_decision_audit_trail_must_be_true: true
bias_monitoring:
  frequency: continuous
  protected_attributes:
    - gender
    - race
    - age
    - disability
    - national_origin
  metrics:
    - name: Demographic Parity in LLM Outputs
      threshold: delta <= 0.05 across protected groups
      action_on_breach: block_deployment
    - name: Output Consistency Score
      threshold: variance < 0.1 on identical inputs across runs
      action_on_breach: alert_and_review
    - name: Explanation Completeness
      threshold: adverse_decision_explanation_present == true
      action_on_breach: block_output
  benchmark_methodology:
    - name: BBQ (Bias Benchmark for QA)
      scope: discrimination in LLM question-answering
    - name: BOLD
      scope: open-ended generation bias
    - name: DecodingTrust
      scope: trustworthiness across protected groups
remediation_steps:
  - "Test LLM outputs for demographic parity before deployment using BBQ and BOLD benchmarks"
  - "Implement output consistency testing — same input must not produce materially different decisions across runs per Article 15"
  - "Ensure every adverse automated decision includes a plain-language explanation per Article 13 Para 3b"
  - "Display clear AI disclosure at point of user interaction per Article 50 Para 1"
  - "Test for prompt injection if the application accepts free-form user input — manipulation of regulated outputs is a deployer liability"
  - "Implement audit trail for all agentic decisions including intermediate reasoning steps per Article 12"
  - "Conduct hallucination rate testing — fabricated compliance documentation creates direct regulatory liability"
created_at: "2026-03-18T00:00:00Z"
